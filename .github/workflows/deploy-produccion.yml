name: 3. Ambiente Produccion - Despliegue Cloudflare + AWS EC2 (Docker)

on:
  push:
    branches:
      - produccion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_cloudflare_worker:
    name: "1. Cloudflare: Actualizar Proxy/WAF en *.workers.dev"
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Checkout rama produccion
        uses: actions/checkout@v4
        with:
          ref: produccion

      - name: Verificar credenciales de Cloudflare Workers
        id: check_cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "Credenciales de Cloudflare API encontradas."
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Aviso: Cloudflare ya construye automaticamente desde la rama produccion (o faltan secrets opcionales CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID). Omitiendo paso CLI."
          fi

      - name: Desplegar Worker en Cloudflare (*.workers.dev)
        if: steps.check_cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy

  deploy_aws_ec2:
    name: "2. AWS EC2: Desplegar Contenedores en Ubuntu con Docker"
    needs: deploy_cloudflare_worker
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Verificar credenciales SSH de AWS EC2
        id: check_aws
        env:
          AWS_HOST: ${{ secrets.AWS_EC2_HOST }}
          AWS_KEY: ${{ secrets.AWS_EC2_SSH_KEY }}
        run: |
          if [ -n "$AWS_HOST" ] && [ -n "$AWS_KEY" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "Credenciales SSH de AWS EC2 encontradas. Iniciando despliegue..."
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Aviso: AWS_EC2_HOST o AWS_EC2_SSH_KEY no estan definidos en Secrets. Omitiendo despliegue SSH."
          fi

      - name: Desplegar en AWS EC2 Ubuntu via SSH
        if: steps.check_aws.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER || 'ubuntu' }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            if [ -d /opt/carta-digital/trabajo_desarrollo_seguro/.git ]; then
              cd /opt/carta-digital/trabajo_desarrollo_seguro
              if [ -f /opt/carta-digital/.env ] && [ ! -f .env ]; then
                cp /opt/carta-digital/.env .env
              fi
            else
              cd /opt/carta-digital
            fi
            git fetch origin produccion
            git reset --hard origin/produccion
            docker compose up -d --build --remove-orphans
            docker image prune -f
