# =============================================================================
# AMBIENTE 1: DESARROLLO (docker-compose.dev.yml)
# Stack: Front-End (Node/Express ES2024) + Back-End (Node/Express MVC) + PostgreSQL 16
# =============================================================================
services:
  db-dev:
    image: postgres:16-alpine
    container_name: pnk-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pnk_security}
      POSTGRES_USER: ${POSTGRES_USER:-pnk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pnk_dev_secret_2026}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pnk_user} -d ${POSTGRES_DB:-pnk_security}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pnk-backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      BACKEND_PORT: 3000
      POSTGRES_HOST: db-dev
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pnk_security}
      POSTGRES_USER: ${POSTGRES_USER:-pnk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pnk_dev_secret_2026}
      CORS_ORIGIN: http://localhost:8080
      ENFORCE_HTTPS: "0"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend/src:/app/src:ro
    depends_on:
      db-dev:
        condition: service_healthy

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pnk-frontend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      FRONTEND_PORT: 8080
      BACKEND_URL: http://backend-dev:3000
    ports:
      - "8080:8080"
    volumes:
      - ./frontend/public:/app/public:ro
      - ./frontend/src:/app/src:ro
    depends_on:
      - backend-dev

volumes:
  pgdata_dev:

